<script>
//夜间(日间)模式
(function(){
    if(document.cookie.replace(/(?:(?:^|.*;\s*)night\s*\=\s*([^;]*).*$)|^.*$/, "$1") === ''){
        if(new Date().getHours() > 22 || new Date().getHours() < 6){
            document.body.classList.remove('io-black-mode');
            document.body.classList.add('io-grey-mode');
            document.cookie = "night=1;path=/";
            console.log('夜间模式开启');
        }else{
            document.body.classList.remove('night');
            document.cookie = "night=0;path=/";
            console.log('夜间模式关闭');
        }
    }else{
        var night = document.cookie.replace(/(?:(?:^|.*;\s*)night\s*\=\s*([^;]*).*$)|^.*$/, "$1") || '0';
        if(night == '0'){
            document.body.classList.remove('night');
        }else if(night == '1'){

        }
    }
})();

<script type="text/javascript">
$(document).ready(function(){
    
    // 1. 逻辑：点击目录标题手动折叠/展开
    $(document).on('click', '.taxonomy-title', function() {
        var content = $(this).closest('.d-flex').next(".taxonomy-content");
        var icon = $(this).find(".toggle-icon");
        
        content.slideToggle(350);
        
        // 💡 修正点：如果内容当前是可见的，说明即将收起 -> 旋转至 -90度（向右）
        // 如果内容当前是隐藏的，说明即将展开 -> 恢复 0度（向下）
        if (content.is(":visible")) {
            icon.css('transform', 'rotate(-90deg)'); 
        } else {
            icon.css('transform', 'rotate(0deg)');
        }
    });

    // 2. 逻辑：侧边栏点击逻辑优化
    $(document).on('click', '.sidebar-item a, a.smooth', function() {
        var href = $(this).attr('href');
        if (href && href.startsWith('#')) {
            expandOnlyTarget(href);
        }
    });

    // 3. 逻辑：处理初始化锚点
    if (window.location.hash) {
        expandOnlyTarget(window.location.hash);
    }

    // --- 工具函数：仅展开目标并折叠其他 ---
    function expandOnlyTarget(hashId) {
        var targetAnchor = $(hashId); 
        if (targetAnchor.length) {
            var targetGroup = targetAnchor.closest('.taxonomy-group');
            
            $(".taxonomy-group").each(function() {
                var $this = $(this);
                var titleText = $this.find(".taxonomy-title").text().trim();
                var content = $this.find(".taxonomy-content");
                var icon = $this.find(".toggle-icon");

                if (titleText === "常用网站" || $this.is(targetGroup)) {
                    // 💡 展开目标或保持常用网站展开
                    if (!content.is(':visible')) {
                        content.slideDown(350);
                    }
                    icon.css('transform', 'rotate(0deg)'); // 展开状态：向下
                } else {
                    // 💡 折叠其他
                    if (content.is(':visible')) {
                        content.slideUp(350);
                    }
                    icon.css('transform', 'rotate(-90deg)'); // 折叠状态：向右
                }
            });
        }
    }
});
</script>
